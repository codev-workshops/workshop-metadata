# sync-map.yaml
#
# Authoritative mapping of Cognition-Partner-Workshops (source) repos to their
# codev-workshops (target) copies, used by scripts/sync_from_source.py.
#
# Pairs were established by SHARED GIT HISTORY (identical root commit), not by name:
# the two orgs use different naming conventions, and several repos share a name while
# having completely unrelated history (see `collisions` below). Never add a pair by
# name alone — run `scripts/sync_from_source.py discover` to verify.
#
# sync policy per pair:
#   ff-only        push only when the target is strictly behind the source default branch
#                  (never a force push, so target-side lab commits can never be lost)
#   pr-on-diverge  same, but when both sides moved, open a PR in the target instead
#   off            never touch this repo
#
# Last verified: 2026-09-01

defaults:
  source_org: Cognition-Partner-Workshops
  target_org: codev-workshops
  sync: ff-only
  new_repos: mirror          # report | mirror  (mirror needs GITHUB_MIRROR_PAT)

pairs:
